version: "v0.4"

project:
  name: "Certified nonreal zero trajectories for the first Haglund pencil"
  description: >-
    A Lean 4 formalization of the literal first incomplete-gamma pencil and
    the nonreal zero-trajectory theorem discharged by the paper's exact
    first-quadrant atlas certificate. The selected theorem proves every
    certified zero simple and gives it a locally unique analytic branch with
    exact negative imaginary velocity, proves that the pencil is real and strictly positive on
    the imaginary axis for nonnegative parameters, and proves strict descent
    with an explicit no-escape radius for every certified forward branch.
  authors:
    - "Mayk Loide Baccaro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mayk Loide Baccaro"

repository:
  role: "substantive-development"

