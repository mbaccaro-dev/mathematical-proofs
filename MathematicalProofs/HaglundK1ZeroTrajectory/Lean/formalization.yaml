version: "v0.4"

project:
  name: "Analytic certificate bridge for the first Haglund zero trajectory"
  description: >-
    A Lean 4 formalization of the literal first incomplete-gamma pencil and
    the analytic interface used to control its zeros. It proves the exact
    certificate-to-simplicity and descending-velocity implication, an
    integral positivity theorem excluding the imaginary axis for nonnegative
    parameters, an explicit no-escape bound from the outer-cone estimate, the
    one-sided Puiseux-direction contradiction at real collisions, and the
    local analytic zero branch with its exact velocity.
  authors:
    - "Mayk Loide Baccaro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mayk Loide Baccaro"

repository:
  role: "substantive-development"

classification:
  arxiv: ["math.CV", "math.NT", "math.NA"]
  msc2020: ["30D15", "11M26", "65G20", "32S05"]

sources:
  - title: "Haglund's Zero-Trajectory Conjecture for the First Riemann Xi Approximant"
    authors:
      - "Mayk Loide Baccaro"
    id: "10.5281/zenodo.22059236"
    type: "paper"
    location: "https://doi.org/10.5281/zenodo.22059236"
    relationship: "formalizes"
    note: >-
      The formalization proves five load-bearing analytic interfaces used by
      the paper; the numerical atlas and the full collision multiset
      construction remain outside Lean.
    license: "unknown"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    The selected statements use the paper's literal incomplete-gamma source
    and first interpolation pencil. They connect the exact four-way interval
    certificate to zero simplicity and strict downward velocity, exclude the
    imaginary axis by a direct integral-positivity proof, convert the outer
    cone estimate into an explicit uniform branch bound, rule out a
    right-side upper-half-plane collision branch from its scaled asymptotics,
    and construct the locally unique analytic zero branch with the manuscript's
    velocity. The numerical interval atlas itself, real-axis positivity,
    Weierstrass preparation, Puiseux existence, and the full global
    arbitrary-multiplicity collision theorem are not formalized here.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "HaglundK1ZeroTrajectory.firstQuadrantCertificate_zero_simple_descending"
      file: "HaglundK1ZeroTrajectory/AnalyticCertificate.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "HaglundK1ZeroTrajectory.realPencil_imaginaryAxis_ne_zero"
      file: "HaglundK1ZeroTrajectory/AnalyticCertificate.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "HaglundK1ZeroTrajectory.branch_uniformly_bounded"
      file: "HaglundK1ZeroTrajectory/AnalyticCertificate.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "HaglundK1ZeroTrajectory.no_right_upper_emergence_of_scaled_limits"
      file: "HaglundK1ZeroTrajectory/AnalyticCertificate.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "HaglundK1ZeroTrajectory.exists_local_descending_zero_motion"
      file: "HaglundK1ZeroTrajectory/AnalyticCertificate.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

