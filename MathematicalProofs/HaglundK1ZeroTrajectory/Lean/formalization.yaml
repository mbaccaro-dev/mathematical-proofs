      outside Lean.
    license: "unknown"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    The selected statements use the paper's literal incomplete-gamma source
    and first interpolation pencil. One composite theorem converts the exact
    four-way first-quadrant certificate into zero simplicity and locally
    unique analytic zero motion with strict downward velocity, proves real strict positivity on
    the imaginary axis, and gives strict descent and an explicit no-escape
    radius for every certified forward branch. The interval-arithmetic proof
    of the first-quadrant certificate, real-axis positivity, Weierstrass
    preparation, Puiseux existence, and the full arbitrary-multiplicity
    collision theorem are not formalized here.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
