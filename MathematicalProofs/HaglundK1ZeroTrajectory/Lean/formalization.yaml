fidelity:
  divergences: >-
    The literal first pencil and five analytic interfaces are formalized
    directly. The numerical atlas is an external verified computation.
    Real-axis positivity, Weierstrass preparation, Puiseux existence, the full
    collision multiset construction, and the resulting global k=1 theorem
    remain manuscript-level mathematics.

review:
  status: "agent-reviewed"
  reviewers:
    - "OpenAI GPT-5 (Codex)"
  notes: >-
    Independent checks covered the literal source bridge, phase and velocity
    signs, parameter direction, endpoint ownership, quantifiers, axiom use,
    and manuscript correspondence. No human peer review is claimed.

alignment:
  namespace: "HaglundK1ZeroTrajectory"
  statements:
    - source: "Interval certificate implies simple zeros and strict descent"
      lean: "HaglundK1ZeroTrajectory.firstQuadrantCertificate_zero_simple_descending"
      module: "HaglundK1ZeroTrajectory.AnalyticCertificate"
      status: "proved"
      note: "The four exact terminal alternatives are eliminated or converted to the negative velocity numerator without changing the parameter interval."
    - source: "The imaginary axis contains no zero for a nonnegative interpolation parameter"
      lean: "HaglundK1ZeroTrajectory.realPencil_imaginaryAxis_ne_zero"
      module: "HaglundK1ZeroTrajectory.AnalyticCertificate"
      status: "proved"
      note: "Each literal incomplete-gamma source summand is strictly positive after evaluation on the imaginary axis."
    - source: "No forward escape under the certified outer-cone estimate"
      lean: "HaglundK1ZeroTrajectory.branch_uniformly_bounded"
      module: "HaglundK1ZeroTrajectory.AnalyticCertificate"
      status: "proved"
      note: "A uniform height ceiling and the logarithmic outer-cone inequality give the explicit radius bound."
    - source: "A collision branch cannot emerge into the upper half-plane on the right"
      lean: "HaglundK1ZeroTrajectory.no_right_upper_emergence_of_scaled_limits"
      module: "HaglundK1ZeroTrajectory.AnalyticCertificate"
      status: "proved"
      note: "Positive one-sided scaled height and velocity limits contradict the certified strict-descent law."
    - source: "A certified simple zero has a local analytic branch with exact descending velocity"
      lean: "HaglundK1ZeroTrajectory.exists_local_descending_zero_motion"
      module: "HaglundK1ZeroTrajectory.AnalyticCertificate"
      status: "proved"
      note: "The complex inverse function theorem constructs the branch and identifies its derivative exactly."

