version: "v0.4"

project:
  name: "Critical-exponent scale transforms: multilinear mixture law"
  description: >-
    A Lean 4 proof that a dilation-covariant multilinear observable has an
    exact finite perturbation expansion whose first nonzero grouped term
    controls both its leading norm and its dyadic energy, with a strict
    critical-exponent gap.
  authors:
    - "Mayk Loide Baccaro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mayk Loide Baccaro"

classification:
  arxiv: ["math.CA", "math.NT"]
  msc2020: ["26A12", "42A38", "11M26"]

sources:
  - title: "Critical-Exponent Scale Transforms"
    authors:
      - "Mayk Loide Baccaro"
    id: "10.5281/zenodo.22005931"
    type: "paper"
    location: "https://doi.org/10.5281/zenodo.22005931"
    relationship: "formalizes"
    note: "The formalization proves the finite multilinear mixture law, its first-visible asymptotic, and its normalized dyadic-energy limit."
    license: "unknown"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    For real-valued continuous signals on the positive half-line, the
    formalization derives the full finite mixture expansion from multilinearity
    and dilation covariance. It proves the normalized dyadic-energy limit by
    dominated convergence. Under an exact nonzero first-visible-term hypothesis,
    it then proves the leading norm limit, strict positivity of the energy
    constant, and the exact critical-exponent gap. The paper's zero-channel,
    error-term, and other transform branches remain outside this result.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "RiemannHypothesisProofFactory.CriticalExponentTransforms.paper_multilinear_operator_expansion"
      file: "RiemannHypothesisProofFactory/CriticalExponentTransforms/MixtureGapLaw.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.CriticalExponentTransforms.paper_normalized_mixture_dyadic_energy_limit"
      file: "RiemannHypothesisProofFactory/CriticalExponentTransforms/MixtureGapLaw.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.CriticalExponentTransforms.multilinear_mixture_gap_law"
      file: "RiemannHypothesisProofFactory/CriticalExponentTransforms/MixtureGapLaw.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

