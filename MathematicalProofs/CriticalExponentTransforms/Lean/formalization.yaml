# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Critical-exponent scale transforms: pure-power gap law"
  description: >-
    A Lean 4 proof of the paper's operator-level pure-power normal form and
    critical exponent gap, with additional algebraic certificates.
  authors:
    - "Mayk Loide Baccaro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mayk Loide Baccaro"

classification:
  arxiv: ["math.CA", "math.NT"]
  msc2020: ["26A12", "42A38", "11M26"]

sources:
  - title: "Critical-Exponent Scale Transforms"
    authors:
      - "Mayk Loide Baccaro"
    id: "10.5281/zenodo.22005931"
    type: "paper"
    location: "https://doi.org/10.5281/zenodo.22005931"
    relationship: "formalizes"
    note: "The formalization proves the general pure-power operator normal form and gap law and checks supporting algebraic seams from the paper."
    license: "unknown"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    The submission proves the general operator-level pure-power normal form
    and its exact critical exponent gap. It also proves ten supporting
    algebraic statements covering multilinear and homogeneous gaps, a scalar
    specialization, saturation inversion, and an inverse-symbol norm bound.
    It does not formalize the Abel analysis, vector-valued multilinear
    asymptotics, phase-orbit argument, complex Mellin theorem, or dyadic
    energy integrals.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "RiemannHypothesisProofFactory.CriticalExponentTransforms.pure_power_gap_law"
      file: "RiemannHypothesisProofFactory/CriticalExponentTransforms/PurePowerGap.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.CriticalExponentTransforms.multilinear_gap_identity"
      file: "RiemannHypothesisProofFactory/CriticalExponentTransforms/AlgebraicKernel.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.CriticalExponentTransforms.saturation_inverse"
      file: "RiemannHypothesisProofFactory/CriticalExponentTransforms/AlgebraicKernel.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.CriticalExponentTransforms.inverse_symbol_lower_bound"
      file: "RiemannHypothesisProofFactory/CriticalExponentTransforms/AlgebraicKernel.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["OpenAI GPT-5 (Codex)"]
      framework: "Codex"
      tool_setup: "Human-directed AI-assisted Lean development using Mathlib tactics, statement comparison, Comparator, the Lean kernel, and NanoDa."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "The human owner selected the result and directed formalization, auditing, and release preparation."
  spend_usd: "subscription-based"
  notes: "The algebraic kernel was built with a pinned environment and checked against the paper's displayed formulas."

fidelity:
  divergences: "The operator-level normal form and gap are exact; the displayed energy identity and the paper's other analytic or asymptotic theorems remain outside the formal claim."

review:
  status: "agent-reviewed"
  reviewers:
    - "OpenAI GPT-5 (Codex)"
  notes: "Independent agent lanes audited the exponent formulas, hypotheses, definitions, constants, axiom reports, and paper correspondence. No human peer review is claimed."

alignment:
  namespace: "RiemannHypothesisProofFactory.CriticalExponentTransforms"
  statements:
    - source: "Pure-power gap law"
      lean: "RiemannHypothesisProofFactory.CriticalExponentTransforms.pure_power_gap_law"
      module: "RiemannHypothesisProofFactory.CriticalExponentTransforms.PurePowerGap"
      status: "proved"
      note: "This is the paper's general homogeneous-covariant operator normal form and exact critical exponent gap; only its separate energy integral is omitted."
    - source: "Multilinear and homogeneous critical-gap formulas"
      lean: "RiemannHypothesisProofFactory.CriticalExponentTransforms.multilinear_gap_identity"
      module: "RiemannHypothesisProofFactory.CriticalExponentTransforms.AlgebraicKernel"
      status: "proved"
      note: "Adjacent-order and homogeneous identities are also included in the Comparator theorem list."
    - source: "Scalar pure-power normal form"
      lean: "RiemannHypothesisProofFactory.CriticalExponentTransforms.scalar_pure_power_normal_form"
      module: "RiemannHypothesisProofFactory.CriticalExponentTransforms.AlgebraicKernel"
      status: "partial"
      note: "This is the scalar specialization and does not claim the paper's operator-level theorem."
    - source: "Saturation inversion and Mellin-symbol bound"
      lean: "RiemannHypothesisProofFactory.CriticalExponentTransforms.saturation_inverse"
      module: "RiemannHypothesisProofFactory.CriticalExponentTransforms.AlgebraicKernel"
      status: "proved"
      note: "The inverse-symbol lower bound is separately included in the submitted theorem list."

acknowledgements: "Mathlib, Lean, Comparator, Lean4export, Landrun, and NanoDa."
