status:
  scope: >-
    For real-valued continuous signals on the positive half-line, the
    formalization derives the full finite mixture expansion from multilinearity
    and dilation covariance. It proves the normalized dyadic-energy limit by
    dominated convergence. Under an exact nonzero first-visible-term hypothesis,
    it then proves the leading norm limit, strict positivity of the energy
    constant, and the exact critical-exponent gap. For a normed-space-valued
    nonlinear phase orbit, it derives the complete normal form from exact
    covariance. An explicit positive-block hypothesis excludes the zero orbit;
    the selected theorem propagates that positivity through the exact geometric
    recurrence. The paper's zero-channel,
    error-term, Mellin, saturation, and germ branches remain outside these
    results.
  sorry_count: 0
  sorry_in_definitions: 0
