version: "v0.4"

project:
  name: "Critical-exponent scale transforms: mixtures and phase orbits"
  description: >-
    A Lean 4 proof that a dilation-covariant multilinear observable has an
    exact finite perturbation expansion whose first nonzero grouped term
    controls both its leading norm and its dyadic energy, with a strict
    critical-exponent gap. For a nonlinear periodic phase orbit with a visible
    energy block, it also proves the exact logarithmic normal form and a
    nonzero geometric energy recurrence after a full phase turn.
  authors:
    - "Mayk Loide Baccaro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mayk Loide Baccaro"

