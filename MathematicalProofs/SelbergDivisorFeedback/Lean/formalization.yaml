version: "v0.4"

project:
  name: "Finite prime-factor conditioning construction"
  description: >-
    A Lean 4 proof that correcting one distinguished coefficient in a finite
    set of primes centers a nonzero prime-power perturbation exactly, while the prime factorization
    formula turns coefficient bounds into a uniform logarithmic divisor-residual
    bound. This is the arithmetic construction at the core of the paper's
    conditioning witness.
  authors:
    - "Mayk Loide Baccaro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mayk Loide Baccaro"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11N05", "11M26"]

sources:
  - title: "Selberg Feedback and Approximate Divisor Data Do Not Stably Determine Square-Root Prime Error"
    authors:
      - "Mayk Loide Baccaro"
    id: "10.5281/zenodo.22005767"
    type: "paper"
    location: "https://doi.org/10.5281/zenodo.22005767"
    relationship: "formalizes"
    note: "The selected theorem formalizes the finite prime-factor construction and its exact residual estimate."
    license: "unknown"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    The selected theorem starts with a finite set containing only primes,
    extends its centered coefficients by zero off that set, proves exact
    weighted centering, exhibits a prime where the residual is nonzero, and
    proves the logarithmic bound for the divisor residual at every integer
    through the exact prime factorization formula. The prime-number asymptotics,
    near-linear output separation, Selberg remainder, residual moments, and
    generalized von Mangoldt hierarchy remain manuscript-level arguments.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "RiemannHypothesisProofFactory.SelbergConditioning.finite_prime_factor_conditioning_construction"
      file: "RiemannHypothesisProofFactory/SelbergConditioning/PrimeFactorConstruction.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

