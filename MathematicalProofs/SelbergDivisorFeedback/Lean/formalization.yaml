version: "v0.4"

project:
  name: "Near-linear conditioning of Selberg divisor feedback"
  description: >-
    A Lean 4 proof of the sequence-level conditioning construction for Selberg
    divisor feedback. Two explicit perturbations of the von Mangoldt weight
    stay in the positive prime-power cone, approximate the divisor data to an
    arbitrary tolerance through twice the observation scale, separate their
    summatory outputs at a near-linear power scale, and retain one uniform
    linear Selberg bound.
  authors:
    - "Mayk Loide Baccaro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mayk Loide Baccaro"

repository:
  role: "substantive-development"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11N05", "11M26"]

sources:
  - title: "Selberg Feedback and Approximate Divisor Data Do Not Stably Determine Square-Root Prime Error"
    authors:
      - "Mayk Loide Baccaro"
    id: "10.5281/zenodo.22005767"
    type: "paper"
    location: "https://doi.org/10.5281/zenodo.22005767"
    relationship: "formalizes"
    note: "The selected theorem formalizes the paper's infinite prime-power conditioning construction and its quantitative Selberg-feedback consequence."
    license: "unknown"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    The selected theorem uses the paper's explicit infinite perturbation,
    including the distinguished prime-two correction and constant values on
    every prime-power chain. Its standard analytic inputs state the weighted
    prime-number asymptotic, the negligible two-chain, coefficient and
    Chebyshev bounds, the divisor identity, perturbation moment and harmonic
    bounds, and the classical Selberg estimate. From these inputs Lean derives
    the two actual von Mangoldt weights, positive-cone membership, divisor
    residual tolerance at every index through twice the scale, quantitative
    summatory separation, and a uniform Selberg bound. No output separation or
    conditioning conclusion is assumed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "RiemannHypothesisProofFactory.SelbergConditioning.near_linear_conditioning_witness"
      file: "RiemannHypothesisProofFactory/SelbergConditioning/NearLinearConditioning.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

