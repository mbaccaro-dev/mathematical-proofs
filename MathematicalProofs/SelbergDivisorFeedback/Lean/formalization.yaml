version: "v0.4"

project:
  name: "Finite arithmetic core of a Selberg conditioning obstruction"
  description: >-
    A Lean 4 proof of the finite arithmetic core of a Selberg conditioning
    obstruction. It constructs an exactly centered nonzero prime-coefficient
    direction with a global logarithmic divisor-residual bound, derives a
    nondegenerate two-sign separation and positive Lipschitz lower bound, and
    controls the complete ordered Selberg perturbation with explicit linear
    and quadratic constants.
  authors:
    - "Mayk Loide Baccaro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mayk Loide Baccaro"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11N05", "11M26"]

sources:
  - title: "Selberg Feedback and Approximate Divisor Data Do Not Stably Determine Square-Root Prime Error"
    authors:
      - "Mayk Loide Baccaro"
    id: "10.5281/zenodo.22005767"
    type: "paper"
    location: "https://doi.org/10.5281/zenodo.22005767"
    relationship: "formalizes"
    note: "The selected result group formalizes the paper's finite prime construction, conditioning calculation, and quantitative Selberg-feedback estimate."
    license: "unknown"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    The selected statements construct a finite centered coefficient family on
    actual primes, prove its global logarithmic prime-factor residual bound,
    and exhibit a nonzero residual direction. Given the manuscript's positive
    scale and signed-sum lower bound, they derive the exact two-sign residual
    tolerance, a nonzero output separation, and a strictly positive Lipschitz
    lower bound. They also expand the complete ordered Selberg perturbation
    into its logarithmic moment and linear and quadratic hyperbola terms, then
    bound those terms from a nonnegative base prefix estimate and finite
    harmonic mass. The prime-number asymptotics that supply the signed-sum
    growth, residual moments, and generalized von Mangoldt hierarchy remain
    manuscript-level arguments.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "RiemannHypothesisProofFactory.SelbergConditioning.finite_prime_factor_conditioning_construction"
      file: "RiemannHypothesisProofFactory/SelbergConditioning/PrimeFactorConstruction.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.SelbergConditioning.finite_two_sign_conditioning_obstruction"
      file: "RiemannHypothesisProofFactory/SelbergConditioning/ConditioningWitness.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.SelbergConditioning.finite_selberg_feedback_stability"
      file: "RiemannHypothesisProofFactory/SelbergConditioning/SelbergStability.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

