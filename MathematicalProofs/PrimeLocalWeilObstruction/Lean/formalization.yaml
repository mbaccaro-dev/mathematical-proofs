version: "v0.4"

project:
  name: "Prime-local Weil obstruction: formal kernel"
  description: >-
    A Lean 4 proof of the sharp local first-difference threshold, divergence
    of the manuscript's exact prime-power Weil budget, and the resulting
    infinite scalar-budget obstruction.
  authors:
    - "Mayk Loide Baccaro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mayk Loide Baccaro"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11M26", "11N05"]

sources:
  - title: "A Prime-Local Weil Obstruction"
    authors:
      - "Mayk Loide Baccaro"
    id: "10.5281/zenodo.22005240"
    type: "paper"
    location: "https://doi.org/10.5281/zenodo.22005240"
    relationship: "formalizes"
    note: "The formalization covers the sharp local threshold and exact divergent arithmetic budget used in the paper."
    license: "unknown"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    The submission proves the local block threshold, divergence of the
    von-Mangoldt weighted prefix, its exact prime-power-indexed form, and the
    resulting divergence of every scalar budget paying the sharp local cost. The
    compactly supported smooth dilation, autocorrelation tail argument, and
    explicit-formula normalization remain manuscript-level mathematics.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "RiemannHypothesisProofFactory.PrimeLocalWeil.scalarPartialSum_tendsto_atTop"
      file: "RiemannHypothesisProofFactory/PrimeLocalWeil/BudgetObstruction.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.PrimeLocalWeil.localBlock_nonnegative_iff"
      file: "RiemannHypothesisProofFactory/PrimeLocalWeil/LocalThreshold.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.PrimeLocalWeil.weightedPartialSum_tendsto_atTop"
      file: "RiemannHypothesisProofFactory/PrimeLocalWeil/ArithmeticBudget.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.PrimeLocalWeil.primePowerPartialSum_tendsto_atTop"
