      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.MobiusResidualComplexity.common_core_residual_budget"
      file: "RiemannHypothesisProofFactory/MobiusResidualComplexity/ExactCompression.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.MobiusResidualComplexity.finite_matching_bound"
      file: "RiemannHypothesisProofFactory/MobiusResidualComplexity/CombinatorialKernel.lean"
      sorry_count: 0
