related_formalizations: []

status:
  scope: >-
    The selected results prove the obstruction as an exact dichotomy. If a
    global matching has fewer unmatched vertices than the prime-product
    family, its permitted edge length must reach the retained-prime product.
    At every sufficiently large fixed-band scale, either that edge alternative
    holds or every prime-band product is individually unmatched, with explicit
    binomial and factorial lower bounds. Along the product scale, rank is
    asymptotic to delta times log X divided by log log X, and a normalized
    residual budget below r is eventually below q times the rank whenever
    r/delta is less than q.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
