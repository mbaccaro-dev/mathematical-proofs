    id: "10.5281/zenodo.22006119"
    type: "paper"
    location: "https://doi.org/10.5281/zenodo.22006119"
    relationship: "formalizes"
    note: "The formalization checks the paper's finite algebraic and combinatorial kernel."
    license: "unknown"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    The submission proves the exact number of rank pairs crossing a sign
    cutoff, the equivalent signed prefix-balance formula, common-core
    residual-budget inheritance under passage to a pairwise gcd, pair
    cancellation, a finite matching estimate, zero-sum cell balance, the
    terminal exponent contradiction, the square-root threshold identity, and
    endpoint-doubling connectors. It does not formalize the prime number
    theorem, binomial and logarithmic scale estimates, construction and
    ordering of the Möbius-sign lists, sign parity after gcd removal, or the
    global sparse-jump theorem.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "RiemannHypothesisProofFactory.MobiusResidualComplexity.exact_rank_pair_crossing_count"
