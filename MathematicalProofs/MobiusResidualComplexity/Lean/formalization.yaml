version: "v0.4"

project:
  name: "Prime-band residual-or-unmatched barriers"
  description: >-
    A Lean 4 proof of a residual-or-unmatched barrier for local Möbius
    cancellation. At every sufficiently large fixed-band scale, either the
    permitted edge length reaches the retained-prime product or every member
    of an explicit squarefree prime-product family is unmatched. Chebyshev
    estimates give the exact binomial and factorial population bounds. The
    product scale also converts residual rank to its logarithmic threshold
    with the exact limiting constant.
  authors:
    - "Mayk Loide Baccaro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mayk Loide Baccaro"

