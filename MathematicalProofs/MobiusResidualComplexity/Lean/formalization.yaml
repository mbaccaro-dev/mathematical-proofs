version: "v0.4"

project:
  name: "Prime-band population and logarithmic residual-complexity barriers"
  description: >-
    A Lean 4 proof of the prime-band mechanism behind a logarithmic barrier
    for local Möbius cancellation. Chebyshev estimates supply an eventual
    family of squarefree prime products with exact binomial population. An
    endpoint-scale gcd obstruction forces that population to remain unmatched
    under the stated global residual and edge constraints. The explicit
    product scale also converts the residual budget to its logarithmic
    threshold with the exact limiting constant.
  authors:
    - "Mayk Loide Baccaro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mayk Loide Baccaro"

