      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.MobiusResidualComplexity.strict_exponent_sandwich_impossible"
      file: "RiemannHypothesisProofFactory/MobiusResidualComplexity/CombinatorialKernel.lean"
