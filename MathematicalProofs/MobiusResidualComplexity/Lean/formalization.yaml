version: "v0.4"

project:
  name: "Logarithmic residual-complexity barriers: rank-pair and combinatorial kernel"
  description: >-
    A Lean 4 verification of the exact rank-pair crossing count, common-core
    residual-budget inheritance, finite matching bound, balance and exponent
    identities, and endpoint connectors used in the Möbius residual argument.
  authors:
    - "Mayk Loide Baccaro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mayk Loide Baccaro"

classification:
