automation:
  methods:
    - method: "agent"
      models: ["OpenAI GPT-5 (Codex)"]
      framework: "Codex"
      tool_setup: "Human-directed AI-assisted Lean development using Mathlib tactics, statement comparison, Comparator, the Lean kernel, and NanoDa."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "The human owner selected the result and directed formalization, auditing, and release preparation."
  spend_usd: "subscription-based"
  notes: "The finite kernel was built with a pinned environment and checked against the paper's exact claim boundary."

fidelity:
  divergences: "The submission formalizes the exact rank-crossing count and gcd budget-inheritance connectors, plus the finite algebraic kernel. It does not claim the manuscript's analytic inputs, the construction and ordering of the Möbius-sign lists, sign parity after gcd removal, or the global sparse-jump result."

review:
  status: "agent-reviewed"
  reviewers:
    - "OpenAI GPT-5 (Codex)"
  notes: "Independent agent lanes audited the matching decomposition, cardinality bounds, signs, exponent constants, connector hypotheses, axiom reports, and paper correspondence. No human peer review is claimed."

alignment:
  namespace: "RiemannHypothesisProofFactory.MobiusResidualComplexity"
  statements:
    - source: "Exact fixed-budget rank-pair compression"
      lean: "RiemannHypothesisProofFactory.MobiusResidualComplexity.exact_rank_pair_crossing_count"
      module: "RiemannHypothesisProofFactory.MobiusResidualComplexity.ExactCompression"
      status: "partial"
      note: "This proves exactly that rank pairing leaves the absolute prefix imbalance many crossing pairs. Construction and ordering of the manuscript's Möbius-sign lists and the sign-parity step after gcd removal remain outside Lean."
    - source: "Common-core residual-budget inheritance"
      lean: "RiemannHypothesisProofFactory.MobiusResidualComplexity.common_core_residual_budget"
      module: "RiemannHypothesisProofFactory.MobiusResidualComplexity.ExactCompression"
      status: "proved"
      note: "Replacing a common divisor by the pairwise gcd can only remove residual prime factors, so both residual budgets are preserved."
    - source: "Finite matching estimate"
      lean: "RiemannHypothesisProofFactory.MobiusResidualComplexity.finite_matching_bound"
      module: "RiemannHypothesisProofFactory.MobiusResidualComplexity.CombinatorialKernel"
      status: "partial"
      note: "This proves the bound once crossing and uncovered sets are supplied; it does not formalize the manuscript's matching construction."
    - source: "Terminal exponent obstruction"
      lean: "RiemannHypothesisProofFactory.MobiusResidualComplexity.strict_exponent_sandwich_impossible"
      module: "RiemannHypothesisProofFactory.MobiusResidualComplexity.CombinatorialKernel"
      status: "proved"
      note: "The square-root threshold identity used with this contradiction is also submitted."
    - source: "Sparse-jump endpoint connector"
      lean: "RiemannHypothesisProofFactory.MobiusResidualComplexity.cell_max_le_doubled_cutoff"
      module: "RiemannHypothesisProofFactory.MobiusResidualComplexity.CombinatorialKernel"
      status: "partial"
      note: "This is the exact local connector, without a claim to formalize the global sparse-jump argument."

acknowledgements: "Mathlib, Lean, Comparator, Lean4export, Landrun, and NanoDa."
