status:
  scope: >-
    The selected results prove four connected parts of the obstruction. For
    every exponent strictly between zero and one, the fixed band from y to 8y
    eventually contains enough primes to form the rank floor(y^delta)
    squarefree products, with exact binomial cardinality and an explicit
    factorial lower bound. At finite scale, any single reciprocal matching
    satisfying the stated endpoint-scale residual, parity, and gap conditions
    leaves at least that whole binomial population unmatched. Along the
    explicit product scale, rank is asymptotic to delta times log X divided by
    log log X, and any budget below a normalized constant r is eventually less
    than q times the rank whenever r/delta is less than q.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
