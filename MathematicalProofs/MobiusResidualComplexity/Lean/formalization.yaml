version: "v0.4"

project:
  name: "Fixed-budget pair compression for squarefree Möbius cells"
  description: >-
    A Lean 4 proof that a finite zero-sum squarefree Möbius cell whose actual
    gcd leaves a fixed residual budget admits an exact increasing-rank compression
    into opposite-sign pairs. The theorem preserves the residual budget,
    controls pair gaps by the cell diameter, and gives the exact crossing
    count at every real cutoff.
  authors:
    - "Mayk Loide Baccaro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mayk Loide Baccaro"

repository:
  role: "substantive-development"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11N37", "11A25"]

sources:
  - title: "Logarithmic Residual-Complexity Barriers for Local Möbius Cancellation"
    authors:
      - "Mayk Loide Baccaro"
    id: "10.5281/zenodo.22006119"
    type: "paper"
    location: "https://doi.org/10.5281/zenodo.22006119"
    relationship: "formalizes"
    note: "The formalization proves the paper's exact finite pair-compression theorem."
    license: "unknown"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    The selected theorem starts from a nonempty finite set of positive
    squarefree integers whose Möbius values sum to zero. If division by the
    gcd of the cell leaves at most the fixed number of residual prime factors,
    increasing-rank pairing gives opposite signs,
    preserves both residual budgets after passage to the pairwise gcd, keeps
    every gap within the actual cell diameter, and leaves exactly the absolute
    signed prefix mass many pairs crossing every real cutoff, with membership
    in the crossing set equivalent to exactly one paired endpoint lying below
    the cutoff. The theorem is
    finite and exact. It does not prove the paper's asymptotic logarithmic
    lower bound, prime-number-theorem input, binomial estimates, scale
    conversion, or global sparse-jump argument.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "RiemannHypothesisProofFactory.MobiusResidualComplexity.exact_cell_gcd_pair_compression"
      file: "RiemannHypothesisProofFactory/MobiusResidualComplexity/PairCompression.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

