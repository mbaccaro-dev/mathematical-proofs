    authors:
      - "Mayk Loide Baccaro"
    id: "10.5281/zenodo.22038521"
    type: "paper"
    location: "https://doi.org/10.5281/zenodo.22038521"
    relationship: "formalizes"
    note: "The formalization proves the paper's central discrete cumulative-energy consequence."
    license: "unknown"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    The selected statements use the paper's exact Möbius-logarithm weights,
    strict predecessor convention, half-open dyadic blocks, and both right
    endpoints. They prove the exact conservation law between dyadic defect,
    block variation, and completed cumulative energy. Assuming the universal
    two-endpoint nonnegativity condition, they derive an explicit cubic
    logarithmic bound for the positive cumulative energy at every integer
    endpoint. The condition itself is not proved. The analytic equivalence
    with the Riemann hypothesis, Mellin and Fourier analysis, reciprocal-zeta
    continuation, zero simplicity, and reciprocal-residue budget remain
    manuscript-level mathematics.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "RiemannHypothesisProofFactory.SubpowerDyadicEnergy.dyadic_energy_conservation"
      file: "RiemannHypothesisProofFactory/SubpowerDyadicEnergy/DyadicBalance.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.SubpowerDyadicEnergy.paperP1_implies_cumulative_energy_cubic_bound"
      file: "RiemannHypothesisProofFactory/SubpowerDyadicEnergy/DyadicBalance.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

