version: "v0.4"

project:
  name: "Cumulative dyadic energy for Möbius-logarithm prefixes"
  description: >-
    A Lean 4 proof of the exact conservation law connecting the paper's
    dyadic defect, block variation, and positive cumulative prefix energy.
    Under the stated universal two-endpoint condition, the formalization
    derives an explicit cubic logarithmic bound for that cumulative energy at
    every endpoint.
  authors:
    - "Mayk Loide Baccaro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mayk Loide Baccaro"

repository:
  role: "substantive-development"

classification:
