related_formalizations: []

status:
  scope: >-
    The selected statements use the paper's exact Möbius-logarithm weights,
    strict predecessor convention, and half-open power-of-two blocks. They
    telescope the local identities into the exact global energy balance,
    including its initial boundary term. Eventual defect nonnegativity only
    on those blocks gives an explicit cubic logarithmic bound for positive
    cumulative energy at every integer endpoint, with all earlier scales kept
    in a finite constant. An explicit weighted-squarefree remainder premise
    yields the sharp 6/pi^2 leading coefficient at powers of two. Neither the
    sign condition nor the remainder estimate is proved here. Mellin analysis,
    reciprocal-zeta continuation, RH equivalence, zero simplicity, and the
    residue budget remain manuscript-level mathematics.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]
  main_results:
    - declaration: "RiemannHypothesisProofFactory.SubpowerDyadicEnergy.dyadic_global_energy_balance"
      file: "RiemannHypothesisProofFactory/SubpowerDyadicEnergy/EventualDyadicBalance.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.SubpowerDyadicEnergy.eventualDyadicDefectFrom_implies_sharp_power_energy_bound"
      file: "RiemannHypothesisProofFactory/SubpowerDyadicEnergy/EventualDyadicBalance.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"
    - declaration: "RiemannHypothesisProofFactory.SubpowerDyadicEnergy.eventualDyadicDefectFrom_implies_cumulative_energy_cubic_bound"
      file: "RiemannHypothesisProofFactory/SubpowerDyadicEnergy/EventualDyadicBalance.lean"
      sorry_count: 0
      axioms: ["propext", "Quot.sound", "Classical.choice"]
      comparator_config: "comparator.json"

