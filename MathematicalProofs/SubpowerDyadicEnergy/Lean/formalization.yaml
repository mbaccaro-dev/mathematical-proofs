version: "v0.4"

project:
  name: "Eventual dyadic defect and Möbius-logarithm energy"
  description: >-
    A Lean 4 proof of the global power-of-two balance connecting dyadic
    defect, block variation, and positive Möbius-logarithm prefix energy.
    Eventual nonnegativity on exactly those dyadic blocks gives an explicit
    all-endpoint cubic energy bound. With the stated weighted-squarefree
    remainder estimate, the formalization also recovers the sharp 6/pi^2
    leading coefficient and retains the complete finite-prefix correction.
  authors:
    - "Mayk Loide Baccaro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Mayk Loide Baccaro"

