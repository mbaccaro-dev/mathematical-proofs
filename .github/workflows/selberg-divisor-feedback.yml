name: Selberg divisor-feedback Lean verification

on:
  push:
    branches: [main]
    paths:
      - "MathematicalProofs/SelbergDivisorFeedback/Lean/**"
      - ".github/workflows/selberg-divisor-feedback.yml"
  pull_request:
    branches: [main]
    paths:
      - "MathematicalProofs/SelbergDivisorFeedback/Lean/**"
      - ".github/workflows/selberg-divisor-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build the pinned Lean project
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: MathematicalProofs/SelbergDivisorFeedback/Lean
          build: true
          build-args: "--wfail"
          test: false

      - name: Check the paper-wide certificate
        working-directory: MathematicalProofs/SelbergDivisorFeedback/Lean
        run: lake env lean RiemannHypothesisProofFactory/SelbergConditioning/PaperCertificate.lean
