name: Lean verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build the pinned Lean project
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: MathematicalProofs/BoundaryConstantObstruction/Lean
          build: true

      - name: Check the paper-wide certificate
        working-directory: MathematicalProofs/BoundaryConstantObstruction/Lean
        run: lake env lean BoundaryConstantObstruction/IncompleteGamma/PaperCertificate.lean
